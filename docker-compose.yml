services:
  postgres:
    image: postgres:16-alpine
    container_name: coldaisle-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coldaisle_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coldaisle_secret_dev}
      POSTGRES_DB: ${POSTGRES_DB:-coldaisle_telemetry}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coldaisle_admin} -d ${POSTGRES_DB:-coldaisle_telemetry}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: coldaisle-mosquitto
    restart: unless-stopped
    ports:
      - "${MOSQUITTO_PORT:-1883}:1883"
      - "${MOSQUITTO_WS_PORT:-9001}:9001"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquittodata:/mosquitto/data

volumes:
  pgdata:
  mosquittodata:
