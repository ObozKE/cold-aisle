# Mosquitto MQTT Broker Configuration
listener 1883 0.0.0.0
allow_anonymous true

# WebSocket Listener (optional browser direct connections)
listener 9001 0.0.0.0
protocol websockets

# Persistence & Logging
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
